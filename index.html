<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Journey Informer</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<style>

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

#map{
  width:100%;
  height:100%;
}

/* =========================================================
TITLE
========================================================= */

.app-title{

  position:absolute;
  top:8px;
  left:10px;

  z-index:99999;

  background:rgba(0,0,0,0.75);

  color:#fff;

  padding:4px 10px;

  border-radius:8px;

  font-size:12px;
  font-weight:bold;

  backdrop-filter:blur(5px);
}

/* =========================================================
CONTROLS
========================================================= */

.controls{

  position:absolute;

  top:8px;
  right:8px;

  z-index:99999;

  display:flex;
  gap:4px;
  align-items:center;

  background:rgba(0,0,0,0.72);

  padding:4px 5px;

  border-radius:8px;

  backdrop-filter:blur(5px);
}

button,
select{

  border:none;
  outline:none;

  padding:3px 6px;

  border-radius:4px;

  font-weight:600;
  font-size:10px;

  height:22px;
}

button{

  background:#ffcc00;
  cursor:pointer;
}

/* =========================================================
TRAIN PARTS
========================================================= */

.train-part{

  position:absolute;

  left:50%;
  top:50%;

  transform-origin:center center;

  will-change:transform;
}

/* =========================================================
ENGINE
========================================================= */

.engine{

  width:16px;
  height:34px;

  border-radius:6px 6px 10px 10px;

  background:
    linear-gradient(
      to bottom,
      #d32f2f,
      #7f0000
    );

  border:1px solid #111;

  position:relative;

  overflow:hidden;

  box-shadow:
    0 2px 5px rgba(0,0,0,0.45);
}

.engine::before{

  content:'';

  position:absolute;

  top:3px;
  left:3px;
  right:3px;

  height:6px;

  border-radius:3px;

  background:#555;
}

.engine::after{

  content:'';

  position:absolute;

  top:11px;
  left:4px;
  right:4px;

  height:12px;

  background:#90caf9;
}

/* =========================================================
BOGIES
========================================================= */

.bogie{

  width:13px;
  height:28px;

  border-radius:4px;

  background:
    linear-gradient(
      to bottom,
      #f5f5f5,
      #d6d6d6
    );

  border:1px solid #222;

  position:relative;

  overflow:hidden;

  box-shadow:
    0 1px 4px rgba(0,0,0,0.4);
}

.bogie::before{

  content:'';

  position:absolute;

  left:3px;
  right:3px;
  top:4px;
  bottom:4px;

  background:
    repeating-linear-gradient(
      to bottom,
      #90caf9 0px,
      #90caf9 2px,
      transparent 2px,
      transparent 4px
    );
}

/* =========================================================
CAR
========================================================= */

.car{

  width:20px;
  height:36px;

  border-radius:10px;

  background:
    linear-gradient(
      to bottom,
      #ff9800 0%,
      #ef6c00 45%,
      #d84315 100%
    );

  border:1.5px solid #111;

  position:relative;

  overflow:hidden;

  box-shadow:
    0 3px 8px rgba(0,0,0,0.45);
}

.car::before{

  content:'';

  position:absolute;

  left:3px;
  right:3px;

  top:5px;

  height:11px;

  border-radius:5px;

  background:
    linear-gradient(
      to bottom,
      #d7f0ff,
      #90caf9
    );
}

.car::after{

  content:'';

  position:absolute;

  left:4px;
  right:4px;

  bottom:6px;

  height:10px;

  border-radius:5px;

  background:
    linear-gradient(
      to bottom,
      #ffcc80,
      #ef6c00
    );
}

/* =========================================================
PLATFORM ANIMATION
========================================================= */

.station-wrapper{

  background:transparent !important;
  border:none !important;

  animation:
    fadeInPlatform 0.35s ease;
}

.station-wrapper.fade-out{

  animation:
    fadeOutPlatform 0.35s ease forwards;
}

@keyframes fadeInPlatform{

  from{
    opacity:0;
    transform:scale(0.88);
  }

  to{
    opacity:1;
    transform:scale(1);
  }
}

@keyframes fadeOutPlatform{

  from{
    opacity:1;
    transform:scale(1);
  }

  to{
    opacity:0;
    transform:scale(0.9);
  }
}

/* =========================================================
ROAD SIGN
========================================================= */

.road-sign{

  position:absolute;

  left:50%;
  top:-52px;

  transform:
    translateX(-50%);

  width:70px;
  height:52px;

  border-radius:
    35px 35px 8px 8px;

  background:
    linear-gradient(
      to bottom,
      #ffd600 0%,
      #ffd600 45%,
      #ffffff 45%,
      #ffffff 100%
    );

  border:2px solid #222;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  padding:4px;

  font-size:9px;
  line-height:11px;

  font-weight:800;

  color:#111;
}

</style>
</head>

<body>

<div class="app-title">
  Journey Informer
</div>

<div class="controls">

  <button onclick="startAnimation()">
    Start
  </button>

  <button onclick="clearRoute()">
    Clear
  </button>

  <select
    id="vehicleSelector"
    onchange="changeVehicleTheme()"
  >

    <option value="rajdhani">
      Rajdhani
    </option>

    <option value="shatabdi">
      Shatabdi
    </option>

    <option value="vande">
      Vande Bharat
    </option>

    <option value="duronto">
      Duronto
    </option>

    <option value="garib">
      Garib Rath
    </option>

    <option value="car">
      Car
    </option>

  </select>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map',{
  zoomControl:false,
  attributionControl:false
}).setView([22.5,79],5);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);

let route = [];
let smoothRoute = [];
let stationData = [];
let markers = [];
let finalVisibleStations = [];

let currentVehicle = 'rajdhani';

const trackLine = L.polyline([],{
  color:'#d32f2f',
  weight:6,
  opacity:0.95
}).addTo(map);

/* =========================================================
ADD STATION
========================================================= */

map.on('click',function(e){

  let name =
    prompt(
      'Enter Station Name (Leave Blank For Passing Route)'
    );

  if(name === null)
    return;

  name = name.trim();

  const coords = [
    e.latlng.lat,
    e.latlng.lng
  ];

  route.push(coords);

  stationData.push({
    coords,
    name,
    isPassingPoint:name === ''
  });

  if(name !== ''){

    const marker =
      L.circleMarker(coords,{
        radius:5,
        color:'orange',
        fillColor:'yellow',
        fillOpacity:1
      }).addTo(map);

    markers.push(marker);
  }

  smoothRoute =
    generateSmoothRoute(route);
});

/* =========================================================
SMOOTH ROUTE
========================================================= */

function generateSmoothRoute(points){

  if(points.length < 2)
    return points;

  const smooth = [];

  for(let i=0;i<points.length-1;i++){

    const p0 = points[i];
    const p1 = points[i+1];

    for(let t=0;t<=1;t+=0.01){

      smooth.push([
        p0[0] + (p1[0]-p0[0])*t,
        p0[1] + (p1[1]-p0[1])*t
      ]);
    }
  }

  return smooth;
}

/* =========================================================
CREATE VEHICLE
========================================================= */

function createVehicle(type){

  if(type === 'car'){

    return L.marker([22.5,79],{

      icon:L.divIcon({

        className:'',

        html:`
        <div class="train-part car"></div>
        `,

        iconSize:[20,36],
        iconAnchor:[10,18]
      })

    }).addTo(map);
  }

  return L.marker([22.5,79],{

    icon:L.divIcon({

      className:'',

      html:`
      <div class="train-part ${type}"></div>
      `,

      iconSize:
        type === 'engine'
        ? [16,34]
        : [13,28],

      iconAnchor:
        type === 'engine'
        ? [8,17]
        : [6,14]
    })

  }).addTo(map);
}

const trainParts = [];

function rebuildVehicle(){

  trainParts.forEach(v=>{

    map.removeLayer(v);
  });

  trainParts.length = 0;

  if(currentVehicle === 'car'){

    trainParts.push(
      createVehicle('car')
    );

    return;
  }

  trainParts.push(createVehicle('engine'));
  trainParts.push(createVehicle('bogie'));
  trainParts.push(createVehicle('bogie'));
  trainParts.push(createVehicle('bogie'));
}

rebuildVehicle();

/* =========================================================
THEMES
========================================================= */

function changeVehicleTheme(){

  currentVehicle =
    document.getElementById(
      'vehicleSelector'
    ).value;

  rebuildVehicle();

  const themes = {

    rajdhani:'#d32f2f',
    shatabdi:'#1565c0',
    vande:'#546e7a',
    duronto:'#2e7d32',
    garib:'#00695c',
    car:'#f57c00'
  };

  trackLine.setStyle({
    color:themes[currentVehicle]
  });
}

/* =========================================================
SHOW STATION
========================================================= */

function showStation(station, angle = 0){

  if(station.isPassingPoint)
    return null;

  if(currentVehicle === 'car'){

    const html = `
    <div
      style="
        width:100px;
        height:80px;
        position:relative;
        overflow:visible;
      "
    >
      <div class="road-sign">
        ${station.name.toUpperCase().replace(/\s+/g,'<br>')}
      </div>
    </div>
    `;

    return L.marker(
      station.coords,
      {
        interactive:false,
        icon:L.divIcon({
          className:'station-wrapper',
          html,
          iconSize:[100,80],
          iconAnchor:[50,40]
        })
      }
    ).addTo(map);
  }

  const html = `

  <div
    style="
      position:relative;
      width:88px;
      height:46px;
      transform:rotate(${angle}deg);
    "
  >

    <div
      style="
        position:absolute;
        left:0;
        top:0;
        width:88px;
        height:14px;
        border-radius:3px;
        border:2px solid #666;
        background:
          repeating-linear-gradient(
            90deg,
            #9e9e9e 0px,
            #9e9e9e 8px,
            #bdbdbd 8px,
            #bdbdbd 16px
          );
      "
    ></div>

    <div
      style="
        position:absolute;
        left:0;
        top:16px;
        width:88px;
        height:14px;
      "
    >

      <div
        style="
          position:absolute;
          left:0;
          right:0;
          top:2px;
          height:3px;
          background:#333;
        "
      ></div>

      <div
        style="
          position:absolute;
          left:0;
          right:0;
          bottom:2px;
          height:3px;
          background:#333;
        "
      ></div>

    </div>

    <div
      style="
        position:absolute;
        left:0;
        bottom:0;
        width:88px;
        height:14px;
        border-radius:3px;
        border:2px solid #666;
        background:
          repeating-linear-gradient(
            90deg,
            #9e9e9e 0px,
            #9e9e9e 8px,
            #bdbdbd 8px,
            #bdbdbd 16px
          );
      "
    ></div>

    <div
      style="
        position:absolute;
        left:50%;
        top:-28px;
        transform:
          translateX(-50%)
          rotate(${-angle}deg);

        background:#f7d100;
        border:2px solid #000;

        padding:2px 8px;

        border-radius:4px;

        font-size:8px;
        font-weight:bold;
        white-space:nowrap;
      "
    >

      ${station.name.toUpperCase()}

    </div>

  </div>
  `;

  return L.marker(
    station.coords,
    {
      interactive:false,
      zIndexOffset:-1000,

      icon:L.divIcon({

        className:'station-wrapper',

        html,

        iconSize:[88,46],

        iconAnchor:[44,23]
      })
    }
  ).addTo(map);
}

/* =========================================================
REMOVE STATION
========================================================= */

function removeStationSmooth(marker){

  if(!marker)
    return;

  const el = marker.getElement();

  if(!el){

    map.removeLayer(marker);
    return;
  }

  el.classList.add('fade-out');

  setTimeout(()=>{
    map.removeLayer(marker);
  },320);
}

/* =========================================================
FINAL STATIONS
========================================================= */

function clearFinalStations(){

  finalVisibleStations.forEach(marker=>{

    map.removeLayer(marker);
  });

  finalVisibleStations = [];
}

function showFinalRouteView(){

  clearFinalStations();

  const validStations =
    stationData.filter(
      s => !s.isPassingPoint
    );

  if(validStations.length === 0)
    return;

  const first =
    validStations[0];

  let firstAngle = 0;

  if(route.length > 1){

    const p1 =
      map.latLngToContainerPoint(
        route[0]
      );

    const p2 =
      map.latLngToContainerPoint(
        route[1]
      );

    firstAngle =
      Math.atan2(
        p2.y - p1.y,
        p2.x - p1.x
      ) * 180 / Math.PI;
  }

  const firstMarker =
    showStation(
      first,
      firstAngle
    );

  if(firstMarker){

    finalVisibleStations.push(
      firstMarker
    );
  }

  if(validStations.length > 1){

    const last =
      validStations[
        validStations.length - 1
      ];

    const before =
      validStations[
        validStations.length - 2
      ];

    const p1 =
      map.latLngToContainerPoint(
        before.coords
      );

    const p2 =
      map.latLngToContainerPoint(
        last.coords
      );

    const endAngle =
      Math.atan2(
        p2.y - p1.y,
        p2.x - p1.x
      ) * 180 / Math.PI;

    const endMarker =
      showStation(
        last,
        endAngle
      );

    if(endMarker){

      finalVisibleStations.push(
        endMarker
      );
    }
  }

  map.flyToBounds(

    L.latLngBounds(route),

    {
      padding:[80,80],
      duration:2
    }
  );
}

/* =========================================================
START ANIMATION
========================================================= */

async function startAnimation(){

  if(smoothRoute.length < 2)
    return;

  let currentStation = null;

  const travelled = [];

  for(let i=0;i<smoothRoute.length;i++){

    const pos = smoothRoute[i];

    travelled.push(pos);

    trackLine.setLatLngs(travelled);

    const next =
      smoothRoute[
        Math.min(
          smoothRoute.length-1,
          i+5
        )
      ];

    const p1 =
      map.latLngToContainerPoint(pos);

    const p2 =
      map.latLngToContainerPoint(next);

    const angle =
      Math.atan2(
        p2.y - p1.y,
        p2.x - p1.x
      ) * 180 / Math.PI;

    if(currentVehicle === 'car'){

      trainParts[0].setLatLng(pos);

      const el =
        trainParts[0]
        .getElement();

      if(el){

        el.querySelector(
          '.train-part'
        ).style.transform = `
          translate(-50%,-50%)
          rotate(${angle+90}deg)
        `;
      }

    }else{

      const gap = 4;

      for(let j=0;j<trainParts.length;j++){

        const idx =
          Math.max(
            0,
            i - j * gap
          );

        trainParts[j]
          .setLatLng(
            smoothRoute[idx]
          );

        const el =
          trainParts[j]
          .getElement();

        if(el){

          el.querySelector(
            '.train-part'
          ).style.transform = `
            translate(-50%,-50%)
            rotate(${angle+90}deg)
          `;
        }
      }
    }

    /* =====================================================
    STATION VISIBILITY
    ===================================================== */

    let nearestStation = null;
    let nearestDistance = Infinity;

    for(const station of stationData){

      if(station.isPassingPoint)
        continue;

      const dist =
        map.distance(
          pos,
          station.coords
        );

      if(dist < nearestDistance){

        nearestDistance = dist;
        nearestStation = station;
      }
    }

    const showDistance =
      currentVehicle === 'car'
      ? 55000
      : 32000;

    if(
      nearestStation &&
      nearestDistance < showDistance
    ){

      if(
        !currentStation ||
        currentStation.stationName !== nearestStation.name
      ){

        if(currentStation){

          removeStationSmooth(
            currentStation.marker
          );
        }

        const stationMarker =
          showStation(
            nearestStation,
            angle
          );

        currentStation = {

          stationName:
            nearestStation.name,

          marker:
            stationMarker
        };
      }
    }

    const hideDistance =
      currentVehicle === 'car'
      ? 35000
      : 42000;

    if(
      currentStation &&
      nearestDistance > hideDistance
    ){

      removeStationSmooth(
        currentStation.marker
      );

      currentStation = null;
    }

    if(i % 8 === 0){

      map.panTo(pos,{
        animate:true,
        duration:0.4
      });
    }

    await new Promise(r=>
      setTimeout(r,25)
    );
  }

  if(currentStation){

    removeStationSmooth(
      currentStation.marker
    );
  }

  showFinalRouteView();
}

/* =========================================================
CLEAR
========================================================= */

function clearRoute(){

  route = [];
  smoothRoute = [];
  stationData = [];

  trackLine.setLatLngs([]);

  clearFinalStations();

  markers.forEach(m=>{

    map.removeLayer(m);
  });

  markers = [];

  rebuildVehicle();
}

changeVehicleTheme();

</script>
</body>
</html>
